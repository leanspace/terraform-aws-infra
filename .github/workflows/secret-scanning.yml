name: Secret Scanning

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secret-scanning-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL --proto '=https' --tlsv1.2 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan PR commits
        id: scan
        run: |
          base=$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          head=$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          [[ $base =~ ^[0-9a-f]{40}$ && $head =~ ^[0-9a-f]{40}$ ]]
          start=$(git merge-base "$base" "$head")
          mkdir -p "$RUNNER_TEMP/gitleaks-home"
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          if GITLEAKS_CONFIG_TOML='' XDG_CONFIG_HOME="$RUNNER_TEMP/gitleaks-home" gitleaks git . --log-opts="$start..$head" \
            --config .gitleaks.toml --redact=100 --no-banner \
            --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null \
            --exit-code 42 --report-format json --report-path "$report" >/dev/null 2>&1; then
            echo "No secrets detected in PR commits."
          else
            status=$?
            if [[ $status == 42 ]]; then
              jq -c '{total: length, findings: (.[0:100] | map({File, StartLine, Commit}))}' "$report" | sed 's/^/findings=/' >> "$GITHUB_OUTPUT"
              jq -r '
                def escape: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C");
                .[] | "::error file=\(.File | escape),line=\(.StartLine | tonumber)::Potential secret detected in commit \(.Commit[0:12]). Remove and rotate the credential."
              ' "$report"
            else
              echo "::error::Gitleaks could not complete the scan. Check the configuration and Git history."
            fi
            exit 1
          fi
      - name: Comment on pull request
        if: ${{ failure() && steps.scan.outputs.findings != '' }}
        uses: actions/github-script@v7
        env:
          FINDINGS: ${{ steps.scan.outputs.findings }}
        with:
          script: |
            const {total, findings} = JSON.parse(process.env.FINDINGS);
            const marker = '<!-- leanspace-gitleaks-warning -->';
            const escape = value => String(value).replace(/[&<>"']/g, char => ({
              '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
            const locations = findings.map(({File, StartLine, Commit}) => {
              const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${encodeURIComponent(Commit)}/${File.split('/').map(encodeURIComponent).join('/')}#L${Number(StartLine)}`;
              return `<li><a href="${escape(url)}"><code>${escape(File)}:${Number(StartLine)}</code></a> (commit ${escape(Commit.slice(0, 12))})</li>`;
            }).join('\n');
            const body = [marker, '## ⚠️ Gitleaks: potential secrets detected',
              '**Revoke and rotate each exposed credential immediately, then remove it from the code and PR commit history. Removing the secret alone is not sufficient.**',
              `<ul>\n${locations}\n</ul>`,
              total > findings.length ? `Showing the first ${findings.length} of ${total} findings. See workflow annotations for all locations.` : '',
              'Secret values are intentionally omitted.'
            ].filter(Boolean).join('\n\n');
            const params = {...context.repo, issue_number: context.issue.number};
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {...params, per_page: 100});
              const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
              } else {
                await github.rest.issues.createComment({...params, body});
              }
            } catch (error) {
              if (error.status !== 403) throw error;
              core.warning('Cannot comment on the PR: grant pull-requests: write in the calling workflow. Fork PR tokens may be read-only. See scan annotations for findings.');
            }
